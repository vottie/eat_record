# Databases per environment.
#
#   development : MySQL, DATABASE_DEV_* (from .env)
#   test        : SQLite (no MySQL server needed to run the tests)
#   staging     : MySQL, DATABASE_* (falls back to DATABASE_DEV_*)
#   production  : MySQL, DATABASE_* (falls back to DATABASE_DEV_*)
#
# Credentials come from environment variables. dotenv-rails loads .env in
# every environment, so a .env next to the app (linked from shared/ on the
# servers) is enough for rails commands run by Capistrano (db:migrate etc.).
default: &default
  adapter: mysql2
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV['DATABASE_DEV_NAME'] %>
  username: <%= ENV['DATABASE_DEV_USER'] %>
  password: <%= ENV['DATABASE_DEV_PASSWORD'] %>
  host: <%= ENV['DATABASE_DEV_HOST'] %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  database: db/test.sqlite3

staging:
  <<: *default
  database: <%= ENV.fetch('DATABASE_NAME') { ENV['DATABASE_DEV_NAME'] } %>
  username: <%= ENV.fetch('DATABASE_USER') { ENV['DATABASE_DEV_USER'] } %>
  password: <%= ENV.fetch('DATABASE_PASSWORD') { ENV['DATABASE_DEV_PASSWORD'] } %>
  host: <%= ENV.fetch('DATABASE_HOST') { ENV['DATABASE_DEV_HOST'] } %>

production:
  <<: *default
  database: <%= ENV.fetch('DATABASE_NAME') { ENV['DATABASE_DEV_NAME'] } %>
  username: <%= ENV.fetch('DATABASE_USER') { ENV['DATABASE_DEV_USER'] } %>
  password: <%= ENV.fetch('DATABASE_PASSWORD') { ENV['DATABASE_DEV_PASSWORD'] } %>
  host: <%= ENV.fetch('DATABASE_HOST') { ENV['DATABASE_DEV_HOST'] } %>
