name: Deploy

# main へのマージで、テスト → ステージング(OCI)へ自動デプロイ → ステージングの画面確認(ブラウザテスト)
# → 承認 → 本番へデプロイ、と進む。
#
#  - ステージングの画面確認(staging-check)に失敗したら、本番へは進まない。緊急のときだけ、
#    手動実行の skip_e2e で、省ける(その分、手動で確認すること)。
#
#  - 本番のジョブは、GitHub の Environment「production」の承認(Required reviewers)を待つ。
#    承認するまで、本番のシークレットは使われず、何も実行されない。
#    承認の前に、ステージングで、Google ログインなど、手動の確認ができる。
#  - 手動実行(Actions タブ → Deploy → Run workflow)では、ブランチを選んで、ステージングだけにデプロイできる
#    (マージ前の Dependabot の PR の確認に使う)。本番へは、main だけ。
#  - 手動実行の reset_db を選ぶと、ステージングのデプロイの後に、ステージングの DB を、固定の初期データに戻す
#    (E2E 用ユーザーのメールとパスワードは、ステージングのサーバーの .env から読む)。
#    マージ後の自動実行では、戻さない(ステージングに溜まったデータで、マイグレーションを確認できるようにするため)。
#  - デプロイするのは、ブランチ名ではなく、このワークフローが動いた時点のコミット(github.sha)。
#    承認を待つ間に、別のコミットが入っても、承認した内容だけが、デプロイされる。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "デプロイ先(production は main だけ)"
        type: choice
        options: [staging, production]
        default: staging
      skip_e2e:
        description: "ステージングの画面確認(ブラウザテスト)を省く(緊急用)"
        type: boolean
        default: false
      reset_db:
        description: "デプロイの後に、ステージングの DB を、固定の初期データに戻す(ステージングだけ。本番の DB には触れない)"
        type: boolean
        default: false

permissions:
  contents: read

# デプロイは、同時に 1 つだけ。途中で止めない(サーバーが中途半端な状態になるのを避ける)。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    # push のとき(main へのマージ)だけ、デプロイの前にテストを実行する。手動実行では、PR 側のテストが済んでいる前提。
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  staging:
    needs: test
    # test が省かれた(手動実行)ときも進めるため、always() を付けて、失敗・キャンセルのときだけ止める。
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # OCI は 1 並列のため、gem のビルドで、50 分前後かかることがある
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          stage: staging
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT }} # ポートは Secret にしない(マスクで、ログの数字が潰れるため)
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          reset-db: ${{ inputs.reset_db && 'true' || 'false' }} # push のときは inputs が空のため、false

  # ステージングの画面確認。ステージングのデプロイが済んだ後に、ブラウザテストを実行する。
  # 失敗したら、production は実行されない。結果の表は、ジョブのサマリに出る。
  staging-check:
    needs: staging
    if: always() && !failure() && !cancelled() && !inputs.skip_e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/staging-check
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          e2e-email: ${{ secrets.STAGING_E2E_EMAIL }}
          e2e-password: ${{ secrets.STAGING_E2E_PASSWORD }}

  production:
    needs: [staging, staging-check]
    if: >-
      always() && !failure() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.target == 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # 本番は、gem のビルドで 15 分前後
    environment: production # Required reviewers の承認を待つ。承認まで、本番の Secrets は使われない
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy
        with:
          stage: production
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
