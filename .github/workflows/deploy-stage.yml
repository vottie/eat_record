name: Deploy stage

# deploy.yml から呼び出される。1 つの環境(staging / production)へ、Capistrano でデプロイする。
# 単独では実行しない。
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # 本番は、gem のビルドで 15 分前後。OCI は、1 並列のため、50 分前後かかることがある
    # Environment の Secrets / Variables を使う。production は、承認(Required reviewers)を待つ。
    environment: ${{ inputs.stage }}
    env:
      DEPLOY_STAGE: ${{ inputs.stage }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }} # ポートは、Secret にしない(マスクで、ログの数字が潰れるため)
      # ブランチ名ではなく、コミットを指定する(承認を待つ間に、ブランチが進んでも、承認した内容だけをデプロイする)
      BRANCH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # 環境ごとの設定は、Git 対象外の config/deploy/*.rb の代わりに、環境変数から作る
      - name: Prepare Capistrano config
        run: cp .github/deploy/stage.rb "config/deploy/${DEPLOY_STAGE}.rb"

      - name: Check deploy
        run: bundle exec cap "$DEPLOY_STAGE" deploy:check

      - name: Deploy
        run: bundle exec cap "$DEPLOY_STAGE" deploy

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
