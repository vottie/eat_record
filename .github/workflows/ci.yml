name: CI

# プルリクエストでテストを実行する。main への push では、deploy.yml が、このワークフローを呼び出して実行する
# (テストに成功したときだけ、デプロイに進むため)。
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# 読み取りだけ。書き込みが必要なジョブは、ジョブ側で個別に足す。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mysql2 gem のビルドに必要(テストの DB は SQLite)
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev

      # Ruby は .ruby-version(3.4.12)を読む。bundler-cache で bundle install と、gem のキャッシュを行う。
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:schema:load

      - name: Run tests
        run: bin/rails test
