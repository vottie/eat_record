name: CI

# プルリクエストでテストを実行する。main への push では、deploy.yml が、このワークフローを呼び出して実行する
# (テストに成功したときだけ、デプロイに進むため)。
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# 読み取りだけ。書き込みが必要なジョブは、ジョブ側で個別に足す。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mysql2 gem のビルドに必要(テストの DB は SQLite)
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev

      # Ruby は .ruby-version(3.4.13)を読む。bundler-cache で bundle install と、gem のキャッシュを行う。
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:schema:load

      - name: Run tests
        run: bin/rails test

  # セキュリティ上の問題になりうるコードの静的解析(#67)。新しい指摘があれば、赤にする。
  # 既存の指摘は、理由付きで config/brakeman.ignore に記録してある。ローカルでも、同じコマンドで確認できる。
  # 解析の内容は、Gemfile.lock で固定した Brakeman の版で決まる(bundle-audit のように、実行日の DB で結果が変わらない)。
  # そのため、audit.yml とは違い、ここ(デプロイの前提のテスト)に置く。
  brakeman:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mysql2 gem のビルドに必要
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager

  # Ruby コードの書き方の静的解析(#70)。新しい指摘があれば、赤にする。
  # 基準は Rails 公式の標準設定(rubocop-rails-omakase)。既存コードの指摘は、.rubocop_todo.yml に退避してある。
  # ローカルでも、同じコマンドで確認できる。解析の内容は、Gemfile.lock で固定した版で決まる。
  rubocop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mysql2 gem のビルドに必要
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  # デプロイ設定(Capistrano)の検査(#87)。サーバーへは接続せず、--dry-run で、実行されるタスクだけを確認する。
  # Capistrano の版と config/deploy.rb の lock の不一致(#86 で起きた)、タスクの定義の誤りを、マージ前に検出する。
  # 設定は、デプロイと同じ .github/deploy/stage.rb を使う(ホスト名などは、ダミーの値)。
  deploy-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEPLOY_HOST: 127.0.0.1
      DEPLOY_USER: deploy
      DEPLOY_PORT: "22"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mysql2 gem のビルドに必要
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmysqlclient-dev

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true

      - name: Dry-run the Capistrano tasks
        run: |
          mkdir -p config/deploy
          for stage in staging production; do
            cp .github/deploy/stage.rb "config/deploy/${stage}.rb"
            DEPLOY_STAGE="$stage" bundle exec cap "$stage" deploy --dry-run
          done
          DEPLOY_STAGE=staging bundle exec cap staging db:reset --dry-run
          # ステージングの DB の初期化(#33)は、本番では拒否されること
          if DEPLOY_STAGE=production bundle exec cap production db:reset --dry-run; then
            echo "::error::db:reset must refuse the production stage"
            exit 1
          fi
