# Devise の users。encrypted_password はテスト用の固定パスワード "password123" のハッシュ。
alice:
  email: alice@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  username: alice

bob:
  email: bob@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  username: bob
